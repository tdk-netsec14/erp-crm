name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql://erp_user:erp_password@localhost:5432/erp_crm_test
  JWT_ACCESS_SECRET: ci-access-secret-at-least-32-chars-long
  JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-chars-long
  NODE_ENV: test
  PORT: 3000
  CORS_ORIGIN: http://localhost:5173

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: erp_password
          POSTGRES_DB: erp_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run DB migrations
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Run API tests
        working-directory: apps/api
        run: npm test

      - name: Build
        run: npm run build
